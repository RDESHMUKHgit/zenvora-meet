services:
  - type: web
    name: zenvora-meet
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://zenvora-meet.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info

