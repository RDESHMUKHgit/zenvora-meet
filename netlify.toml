[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Reverse-proxy /api requests directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://zenvora-meet.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

